{% extends "base.html" %}
{% block title %}Link not valid - QuizHub{% endblock %}
{% block content %}
<div class="page">
  <div class="auth-form-container stack">
    <h1 class="h2">This link doesn't work</h1>
    <p>It has expired or was already used. Register again and we'll send you a new one.</p>
    <a href="{% url 'register' %}" class="btn btn-create register-btn">Register again</a>
  </div>
</div>
{% endblock %}
