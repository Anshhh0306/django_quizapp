{% extends 'base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>🎉 Password Reset Complete!</h2>
            <div class="success-icon">✅</div>
            <p>Your password has been successfully reset.</p>
            <p>You can now sign in with your new password.</p>
        </div>

        <div class="success-actions">
            <a href="{% url 'login' %}" class="btn btn-primary">Sign In Now</a>
        </div>

        <div class="auth-links">
            <p>Need help? <a href="{% url 'home' %}">Contact Support</a></p>
        </div>
    </div>
</div>

<style>
.auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
}

.auth-card {
    background: white;
    border-radius: 15px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    padding: 40px;
    width: 100%;
    max-width: 450px;
    text-align: center;
}

.auth-header h2 {
    color: #333;
    margin-bottom: 15px;
    font-size: 28px;
}

.success-icon {
    font-size: 64px;
    margin: 20px 0;
    animation: bounce 1s ease-in-out;
}

@keyframes bounce {
    0%, 20%, 60%, 100% {
        transform: translateY(0);
    }
    40% {
        transform: translateY(-10px);
    }
    80% {
        transform: translateY(-5px);
    }
}

.auth-header p {
    color: #666;
    margin-bottom: 15px;
    line-height: 1.6;
    font-size: 16px;
}

.success-actions {
    margin: 30px 0;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
    text-align: center;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
}

.auth-links {
    margin-top: 30px;
    text-align: center;
}

.auth-links p {
    margin: 10px 0;
    color: #666;
}

.auth-links a {
    color: #667eea;
    text-decoration: none;
    font-weight: 500;
}

.auth-links a:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
