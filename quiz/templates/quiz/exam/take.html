{% extends "base.html" %}
{% block content %}
<style>
  .exam-wrap { display: flex; gap: 24px; max-width: 1000px; margin: 0 auto; padding: 16px; flex-wrap: wrap; }
  .exam-main { flex: 1 1 520px; min-width: 0; }
  .exam-side { flex: 0 0 220px; }
  .exam-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  #timer { font-size: 1.4rem; font-weight: bold; }
  #timer.low { color: #c0392b; }
  .opt { display: block; width: 100%; text-align: left; padding: 12px 14px; margin: 8px 0; border: 2px solid #ccc;
         border-radius: 8px; background: #fff; color: #111; cursor: pointer; font-size: 1rem; }
  .opt.selected { border-color: #2d7ff9; background: #e8f1ff; }
  .palette { display: flex; flex-wrap: wrap; gap: 6px; }
  .pal-title { flex: 0 0 100%; margin: 10px 0 0; font-size: .85rem; font-weight: bold; color: #444; }
  .pal { width: 38px; height: 38px; border: 1px solid #aaa; border-radius: 6px; background: #fff; color: #111; cursor: pointer; }
  .pal.answered { background: #d4edda; }
  .pal.current { outline: 3px solid #2d7ff9; }
  .nav-row { display: flex; justify-content: space-between; margin-top: 16px; }
  #save-state { font-size: .85rem; color: #666; }
  #save-state.bad { color: #c0392b; font-weight: bold; }
</style>

<div class="exam-wrap">
  <div class="exam-main">
    <div class="exam-bar">
      <strong>{{ exam.title }}</strong>
      <span id="timer"></span>
    </div>
    <p id="section" style="font-weight:bold;color:#2d7ff9;margin-bottom:0;"></p>
    <p id="progress"></p>
    <h3 id="q-text"></h3>
    <div id="options"></div>
    <div class="nav-row">
      <button type="button" class="btn" id="prev">&larr; Previous</button>
      <button type="button" class="btn" id="clear">Clear answer</button>
      <button type="button" class="btn btn-create" id="next">Next &rarr;</button>
    </div>
    <p id="save-state">&nbsp;</p>
  </div>
  <div class="exam-side">
    <h4>Questions</h4>
    <div class="palette" id="palette"></div>
    <p><small>Green = answered. You can go to any question and change answers until time runs out.</small></p>
    <button type="button" class="btn btn-create" id="submit">Submit exam</button>
  </div>
</div>

<form>{% csrf_token %}</form>
{{ payload|json_script:"exam-data" }}

<script>
(function () {
  const data = JSON.parse(document.getElementById('exam-data').textContent);
  const csrf = document.querySelector('input[name=csrfmiddlewaretoken]').value;
  const Q = data.questions;
  const answers = data.answers;          // {questionId: choiceId}, restored from the server on every load
  const pending = {};                    // answers not yet confirmed saved: {questionId: choiceId | ''}
  let current = 0, finished = false;

  const $ = (id) => document.getElementById(id);

  const sectionName = (p) => p + '-mark questions';

  // ---- rendering (textContent only, so question text can never inject HTML) ----
  function render() {
    const q = Q[current];
    $('section').textContent = sectionName(q.points);
    $('progress').textContent = 'Question ' + (current + 1) + ' of ' + Q.length + ' (' + q.points + (q.points === 1 ? ' mark)' : ' marks)');
    $('q-text').textContent = q.text;
    const box = $('options');
    box.textContent = '';
    q.options.forEach((o) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt' + (answers[q.id] === o.id ? ' selected' : '');
      b.textContent = o.text;
      b.onclick = () => choose(q.id, o.id);
      box.appendChild(b);
    });
    $('prev').disabled = current === 0;
    $('next').disabled = current === Q.length - 1;
    renderPalette();
  }
  function renderPalette() {
    const pal = $('palette');
    pal.textContent = '';
    Q.forEach((q, i) => {
      if (i === 0 || Q[i - 1].points !== q.points) {  // a new section starts: add its heading
        const h = document.createElement('div');
        h.className = 'pal-title';
        h.textContent = sectionName(q.points) + ' (' + Q.filter((x) => x.points === q.points).length + ')';
        pal.appendChild(h);
      }
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pal' + (answers[q.id] ? ' answered' : '') + (i === current ? ' current' : '');
      b.textContent = i + 1;
      b.onclick = () => { current = i; render(); };
      pal.appendChild(b);
    });
  }

  // ---- autosave: every click is sent now, and retried every 3 seconds if the connection drops ----
  function setState(text, bad) { const s = $('save-state'); s.textContent = text; s.className = bad ? 'bad' : ''; }
  function choose(qid, cid) {
    if (finished) return;
    if (cid === '') delete answers[qid]; else answers[qid] = cid;
    pending[qid] = cid;
    render();
    flush();
  }
  let flushing = false;
  async function flush() {
    if (flushing || finished) return;
    flushing = true;
    try {
      for (const qid of Object.keys(pending)) {
        const cid = pending[qid];
        setState('Saving…');
        const body = new URLSearchParams({question: qid, choice: cid});
        const r = await fetch(data.answer_url, {method: 'POST', body, credentials: 'same-origin',
                                                headers: {'X-CSRFToken': csrf}});
        if (r.status === 409) { finish(); return; }          // exam closed on the server
        if (r.ok) { if (pending[qid] === cid) delete pending[qid]; setState('Saved ✓'); }
        else { setState('Could not save. Retrying…', true); break; }
      }
    } catch (e) {
      setState('Offline. Your answers are kept here and will save when the connection returns.', true);
    }
    flushing = false;
  }
  setInterval(() => { if (Object.keys(pending).length) flush(); }, 3000);

  // ---- timer: counts down to the SERVER's deadline, not this computer's clock ----
  const t0 = performance.now();
  function remainingMs() { return data.deadline_ms === null ? null : data.deadline_ms - (data.now_ms + (performance.now() - t0)); }
  function drawTimer() {
    const r = remainingMs();
    const t = $('timer');
    if (r === null) { t.textContent = 'No time limit'; return; }
    const s = Math.max(0, Math.ceil(r / 1000));
    t.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    t.className = s <= 300 ? 'low' : '';
    if (r <= 0) submit(true);
  }
  setInterval(drawTimer, 500);

  // ---- submit ----
  async function submit(auto) {
    if (finished) return;
    const unanswered = Q.filter((q) => !answers[q.id]).length;
    if (!auto && !confirm(unanswered ? unanswered + ' question(s) are unanswered. Submit anyway?' : 'Submit your exam now?')) return;
    finished = true;
    try { await fetch(data.submit_url, {method: 'POST', credentials: 'same-origin', headers: {'X-CSRFToken': csrf}}); } catch (e) {}
    window.location = data.done_url;  // the server finalises on this page too, so a failed request is safe
  }
  function finish() { finished = true; window.location = data.done_url; }

  $('prev').onclick = () => { if (current > 0) { current--; render(); } };
  $('next').onclick = () => { if (current < Q.length - 1) { current++; render(); } };
  $('clear').onclick = () => choose(Q[current].id, '');
  $('submit').onclick = () => submit(false);
  render();
  drawTimer();
})();
</script>
{% endblock %}
