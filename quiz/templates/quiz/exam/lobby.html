{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="auth-form-container">
    <h2>{{ exam.title }}</h2>
    <p id="lobby-message">You're in. Waiting for your teacher to start the exam. Keep this page open.</p>
  </div>
</div>

<script>
  // Poll the status every 7-10 seconds (random offset so students don't all hit the server together).
  const statusUrl = "{% url 'exam_status' exam.token %}";
  const message = document.getElementById('lobby-message');
  function poll() {
    fetch(statusUrl, {credentials: 'same-origin'})
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && (data.status === 'running' || data.status === 'ended')) {
          // Step 2c replaces this with the countdown and the exam itself.
          message.textContent = data.status === 'running'
            ? 'The exam has started. (Taking the exam is built in the next step.)'
            : 'This exam has ended.';
          return;
        }
        setTimeout(poll, 7000 + Math.random() * 3000);
      })
      .catch(() => setTimeout(poll, 10000));
  }
  setTimeout(poll, 7000 + Math.random() * 3000);
</script>
{% endblock %}
